<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/eee-fest-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Battle • EEE FEST 2026 | IEEE PES DIU SBC</title>
    <meta name="description" content="AI Prompt Competition organized by IEEE PES DIU SBC for EEE FEST 2026" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Pre-bootstrap SPA path to hash converter -->
    <script>
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        var last = (parts[parts.length - 1] || '').toLowerCase();
        if (['admin', 'submit', 'presentation'].indexOf(last) !== -1) {
          var cleanPath = path.substring(0, path.lastIndexOf('/' + last) + 1);
          window.history.replaceState(null, '', cleanPath + '#' + last + window.location.search);
        }
      })();
    </script>
  </head>
  <body class="bg-dark-950 text-slate-100 min-h-screen antialiased selection:bg-fest-pink selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
