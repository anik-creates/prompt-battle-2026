    <!-- Clean Path Route Initializer (removes # and maintains clean /submit, /admin, etc.) -->
    <script>
      (function() {
        if (window.location.hash) {
          var clean = window.location.hash.replace(/^[#/]+/, '').replace(/\/+$/, '').toLowerCase();
          if (['admin', 'submit', 'presentation', 'judge'].indexOf(clean) !== -1) {
            var isGh = window.location.pathname.indexOf('/prompt-battle-2026') !== -1;
            var basePath = isGh ? '/prompt-battle-2026' : '';
            var target = clean === 'presentation' ? basePath + '/' : basePath + '/' + clean;
            window.history.replaceState(null, '', target + window.location.search);
          }
        }
      })();
    </script>
